<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}BSOS Clean{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            margin: 0;
            background: #f5f9ff;
            color: #0f1f3d;
            font-family: Arial, sans-serif;
        }

        .app-shell {
            min-height: 100vh;
            display: flex;
        }

        .sidebar {
            width: 265px;
            background: #ffffff;
            border-right: 1px solid #e7edf6;
            padding: 28px 18px;
            position: fixed;
            top: 0;
            bottom: 0;
            left: 0;
        }

        .brand {
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 36px;
            color: #0f1f3d;
        }

        .brand span {
            color: #1268f3;
        }

        .nav-link-custom {
            display: block;
            padding: 13px 16px;
            margin-bottom: 8px;
            border-radius: 12px;
            text-decoration: none;
            color: #52627d;
            font-weight: 600;
        }

        .nav-link-custom:hover,
        .nav-link-custom.active {
            background: #eaf3ff;
            color: #1268f3;
        }

        .content {
            margin-left: 265px;
            width: calc(100% - 265px);
        }

        .topbar {
            height: 84px;
            background: #ffffff;
            border-bottom: 1px solid #e7edf6;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding: 0 38px;
        }

        .user-box {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: #dcecff;
            color: #1268f3;
            display: grid;
            place-items: center;
            font-weight: 700;
        }

        .page {
            padding: 34px 40px 48px;
        }

        .page-title {
            font-size: 42px;
            font-weight: 800;
            margin-bottom: 4px;
        }

        .page-subtitle {
            color: #667590;
            font-size: 18px;
        }

        .card-soft {
            background: #ffffff;
            border: 1px solid #edf2f8;
            border-radius: 18px;
            box-shadow: 0 8px 24px rgba(28, 62, 112, 0.06);
        }

        .metric-card {
            padding: 24px;
        }

        .metric-number {
            font-size: 34px;
            font-weight: 800;
        }

        .metric-label {
            font-size: 17px;
            font-weight: 700;
        }

        .metric-help {
            color: #7a889f;
            font-size: 14px;
        }

        .btn-primary-bsos {
            background: #0f67f6;
            color: white;
            border: 0;
            border-radius: 10px;
            padding: 13px 22px;
            font-weight: 700;
            text-decoration: none;
            display: inline-block;
        }

        .btn-primary-bsos:hover {
            background: #0a59d8;
            color: white;
        }

        .badge-soft-blue {
            background: #e8f2ff;
            color: #1268f3;
        }

        .badge-soft-green {
            background: #e8f8ef;
            color: #16834a;
        }

        .badge-soft-red {
            background: #ffecec;
            color: #df3d3d;
        }

        .badge-soft-gray {
            background: #eef2f7;
            color: #4f6077;
        }

        .table thead th {
            color: #52627d;
            font-weight: 700;
            border-bottom: 1px solid #e8eef5;
        }

        .table tbody td {
            vertical-align: middle;
            border-bottom: 1px solid #edf2f7;
        }

        .form-control,
        .form-select {
            min-height: 50px;
            border-radius: 10px;
            border-color: #d7e0ec;
        }

        .form-label {
            font-weight: 700;
            color: #1d2d4b;
        }

        .accessibility-btn {
            border: 2px solid #1268f3;
            background: #ffffff;
            color: #1268f3;
            border-radius: 10px;
            padding: 9px 14px;
            font-weight: 700;
            cursor: pointer;
            margin-right: 22px;
        }

        .accessibility-btn:hover {
            background: #eaf3ff;
        }

        body.high-contrast {
            background: #000000 !important;
            color: #ffffff !important;
        }

        body.high-contrast .sidebar,
        body.high-contrast .topbar,
        body.high-contrast .card-soft {
            background: #000000 !important;
            color: #ffffff !important;
            border-color: #ffffff !important;
        }

        body.high-contrast .content,
        body.high-contrast .page {
            background: #000000 !important;
        }

        body.high-contrast .page-title,
        body.high-contrast .page-subtitle,
        body.high-contrast .metric-label,
        body.high-contrast .metric-help,
        body.high-contrast .form-label,
        body.high-contrast .text-muted,
        body.high-contrast small,
        body.high-contrast strong,
        body.high-contrast h1,
        body.high-contrast h2,
        body.high-contrast h3,
        body.high-contrast h4,
        body.high-contrast p,
        body.high-contrast td,
        body.high-contrast th {
            color: #ffffff !important;
        }

        body.high-contrast .brand,
        body.high-contrast .brand span,
        body.high-contrast a {
            color: #ffff00 !important;
        }

        body.high-contrast .nav-link-custom {
            color: #ffffff !important;
        }

        body.high-contrast .nav-link-custom.active,
        body.high-contrast .nav-link-custom:hover {
            background: #ffff00 !important;
            color: #000000 !important;
        }

        body.high-contrast .form-control,
        body.high-contrast .form-select,
        body.high-contrast textarea {
            background: #000000 !important;
            color: #ffffff !important;
            border: 2px solid #ffffff !important;
        }

        body.high-contrast .btn-primary-bsos {
            background: #ffff00 !important;
            color: #000000 !important;
            border: 2px solid #ffff00 !important;
        }

        body.high-contrast .accessibility-btn {
            background: #ffff00 !important;
            color: #000000 !important;
            border-color: #ffff00 !important;
        }

        body.high-contrast .table {
            color: #ffffff !important;
        }

        body.high-contrast .table td,
        body.high-contrast .table th {
            border-color: #ffffff !important;
        }

    </style>
</head>

<body>
<div class="app-shell">

    <aside class="sidebar">
        <div class="brand">BSOS <span>Clean</span></div>

        <a class="nav-link-custom {% block nav_home %}{% endblock %}" href="{% url 'core:dashboard' %}">
            Agenda de serviços
        </a>

        <a class="nav-link-custom" href="#">Meus serviços</a>
        <a class="nav-link-custom" href="#">Clientes</a>
        <a class="nav-link-custom" href="#">Profissionais</a>
        <a class="nav-link-custom" href="#">Relatórios</a>
        <a class="nav-link-custom" href="#">Configurações</a>
    </aside>

    <div class="content">
        <header class="topbar">

            <button
                id="contrastToggle"
                class="accessibility-btn"
                type="button"
                aria-pressed="false"
                aria-label="Ativar modo de alto contraste">
                Alto contraste
            </button>
            <div class="user-box">
                <div class="avatar">JS</div>
                <div>
                    <div style="font-weight:700;">João Silva</div>
                    <div style="font-size:13px;color:#7a889f;">Administrador</div>
                </div>
            </div>
        </header>

        <main class="page">
            {% block content %}{% endblock %}
        </main>
    </div>

</div>

<script>
    const contrastButton = document.getElementById("contrastToggle");

    function updateContrastButton() {
        const enabled = document.body.classList.contains("high-contrast");
        contrastButton.setAttribute("aria-pressed", enabled ? "true" : "false");
        contrastButton.textContent = enabled
            ? "Contraste normal"
            : "Alto contraste";
    }

    if (localStorage.getItem("bsosHighContrast") === "true") {
        document.body.classList.add("high-contrast");
    }

    updateContrastButton();

    contrastButton.addEventListener("click", function () {
        document.body.classList.toggle("high-contrast");

        const enabled = document.body.classList.contains("high-contrast");
        localStorage.setItem("bsosHighContrast", enabled ? "true" : "false");

        updateContrastButton();
    });
</script>

</body>
</html>
